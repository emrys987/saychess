<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Say Chess</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M6%2052V30q0-6%206-8l40-12q6-2%206%204v34q0%204-4%204H10q-4%200-4-4z%22%20fill%3D%22%23ffc83d%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2247%22%20r%3D%224%22%20fill%3D%22%23e59a00%22%2F%3E%3C%2Fsvg%3E">
<style>:root{--bg:#f3efe4;--ink:#0e0e10;--mut:#5d5b55;--line:#0e0e1022;--cheese:#ffc83d;--cheese-d:#e59a00;--cheese-l:#fff3c4;--pink:#a9c99b;--peri:#d4cd86;--ok:#16794a;--sqL:#d4cd86;--sqD:#86a97b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg) var(--bgimg-body,none) center/cover no-repeat fixed;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.02em;font-weight:700;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h2{font-size:clamp(24px,4vw,32px);margin:26px 0 6px;line-height:1.1}
.mut{color:var(--mut);font-size:13px}
/* header + nav */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap;background:var(--bg)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.1}
.logo small{font:500 10px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.roles{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
.roles button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.roles button.on{background:var(--pink)}
nav{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;position:sticky;top:0;z-index:5;background:#f3efe4e8;backdrop-filter:blur(10px)}
nav button{white-space:nowrap;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--pink)}
nav i{font:600 9px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.05em;background:#0e0e1014;border-radius:999px;padding:2px 7px;font-style:normal}nav i.live{background:var(--cheese)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 44px}
.grid{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:16px;align-items:start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* cards + buttons */
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px}
.btn{border:2px solid var(--ink);border-radius:999px;padding:9px 18px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn.sec{background:#fff;color:var(--ink)}.btn.y{background:var(--cheese);color:var(--ink)}.btn.sm{padding:5px 13px;font-size:13px}.btn:disabled{opacity:.45;cursor:default;transform:none}
textarea,input[type=text],select,input[type=number]{width:100%;border:1.5px solid var(--ink);border-radius:14px;padding:9px 12px;background:#fff}textarea{min-height:70px}
.chip{display:inline-block;font:700 10.5px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:3px 9px;background:#0e0e1010;border:1px solid #0e0e1033}
.chip.ok{background:var(--peri);border-color:var(--ink)}.chip.wait{background:var(--cheese);border-color:var(--ink)}.chip.info{background:#fff;border-color:var(--ink)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.msg{border-radius:16px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;background:var(--cheese-l)}.msg.ok{background:#dff3e6}.msg.bad{background:#ffe0e0}
.bar{height:10px;background:#0e0e1018;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--peri);width:0}
.draft{background:#fff7d6;border:1.5px dashed var(--ink);border-radius:14px;padding:6px 12px;font-size:12px;margin-bottom:12px}
/* chess board: classic green/tan with black grid, cream pieces with black outline */
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:1px;background:#000;border:2px solid #000;aspect-ratio:1;user-select:none;border-radius:6px;overflow:hidden}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:min(8.5vw,48px)}
.sq.l{background:var(--sqL)}.sq.d{background:var(--sqD)}.sq.sel{background:var(--pink)!important}.sq.lm{box-shadow:inset 0 0 0 100px #8b9cff66}.sq.chk{background:#e8776e!important}
.p{line-height:1;-webkit-text-stroke:1.3px #000;paint-order:stroke fill}.p.w{color:#fffbe6}.p.b{color:#262626}
.dot{position:absolute;width:26%;height:26%;border-radius:50%;background:#0e0e1055;pointer-events:none}
.rk,.fl{position:absolute;font-size:11px;font-weight:800;color:#000;pointer-events:none}.rk{left:3px;top:1px}.fl{right:3px;bottom:1px}
.clk{font:800 22px/1 ui-monospace,Menlo,monospace;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;min-width:88px;text-align:center}.clk.act{background:var(--cheese);color:var(--ink)}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vid{background:var(--ink);color:#ffffffcc;border-radius:18px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ffc83d66}}
.moves{max-height:120px;overflow:auto;font:13px ui-monospace,Menlo,monospace;color:var(--mut)}
/* welcome with soft gradient blobs */
.welcome{position:relative;overflow:hidden;border-radius:28px;padding:22px;background:linear-gradient(#ffffff80,#ffffff80),var(--bgimg-hero,none) center/cover no-repeat,#f7f1e3;margin-top:4px}
.blobs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.8}
.blobs i:nth-child(1){width:240px;height:240px;right:-40px;top:-60px;background:#86a97b}.blobs i:nth-child(2){width:200px;height:200px;left:-50px;top:30px;background:#ffc83d}
.blobs i:nth-child(3){width:180px;height:180px;right:70px;bottom:-60px;background:#d4cd86}.blobs i:nth-child(4){width:200px;height:200px;left:42%;bottom:-100px;background:#4f7a58}
.wl{position:relative}.eyebrow{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.welcome h1{margin:0;font-size:clamp(34px,6vw,56px);line-height:1}.welcome p{margin:10px 0 16px;max-width:46ch}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps button{display:flex;gap:8px;align-items:center;border:1.5px solid var(--ink);background:#ffffffd9;border-radius:999px;padding:7px 14px 7px 8px;font-weight:700;cursor:pointer;text-align:left}
.steps b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:13px}.steps button.done b{background:var(--ink);color:var(--cheese)}
/* filter chips + black plan card */
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px;padding-bottom:2px}
.chip-b{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;white-space:nowrap}.chip-b.on{background:var(--pink)}
.blk{background:var(--ink);color:#fff;border-radius:26px;padding:18px}.blk .mut{color:#ffffffa8}.sub{margin:4px 0 12px;color:#ffffffb0;font-size:13px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#1c1c21;border-left:4px solid var(--cheese);border-radius:6px 16px 16px 6px;padding:10px 12px}.tl li.ok{border-color:var(--peri)}.tl li.info{border-color:#8a8a92}
.blk .chip,.ann .chip{background:#fff;color:var(--ink);border-color:#fff}.blk .chip.ok{background:var(--peri)}.blk .chip.wait{background:var(--cheese)}
.bars{height:150px;display:flex;align-items:flex-end;gap:8px;border-bottom:2px solid #fff;padding:0 4px}.bars .b{flex:1;background:var(--peri);border-radius:14px 14px 0 0}
.axis{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin:6px 4px 14px}
.days{display:flex;gap:6px}.days button{flex:1;min-width:0;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:10px 0;font-weight:800;cursor:pointer}.days button.on{background:var(--peri)}
.big{font-size:60px;font-weight:800;letter-spacing:-.04em;line-height:1}.big small{font-size:24px;opacity:.6}
.meter{height:10px;background:#ffffff26;border-radius:999px;overflow:hidden;margin:8px 0 12px}.meter i{display:block;height:100%;background:var(--peri)}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #ffffff26;font-weight:600}
/* featured sets */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fcard{background:var(--ink);color:#fff;border-radius:24px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px}
.art{border-radius:16px;overflow:hidden;aspect-ratio:1/.8}.art svg{width:100%;height:100%;display:block}
.fcard h3{margin:6px 6px 0;font-size:18px}.fcard p{margin:0 6px 6px;color:#ffffffb0;font-size:13px}.fcard .btn{margin:0 6px;align-self:flex-start}
/* account */
.home2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.scene{position:relative;border-radius:26px;overflow:hidden;min-height:330px;background:#0e0e10 var(--bgimg-scene,none) center/cover no-repeat;padding:16px}
.scene::before{content:"";position:absolute;inset:0;background-image:conic-gradient(#ffffff14 25%,transparent 0 50%,#ffffff14 0 75%,transparent 0);background-size:56px 56px;-webkit-mask-image:linear-gradient(transparent 25%,#000);mask-image:linear-gradient(transparent 25%,#000)}
.scene .bgp{position:absolute;right:-8px;bottom:-22px;font-size:170px;color:#fff;opacity:.18;line-height:1}
.glass{position:relative;background:#ffffffee;border-radius:20px;padding:16px;display:grid;gap:8px}.glass h3{margin:0}
.ann{background:var(--ink);color:#fff;border-radius:26px;padding:18px}.ann h3{color:var(--cheese);margin:0 0 6px}
.ann ul{list-style:none;margin:0;padding:0}.ann li{padding:10px 0;border-top:1px solid #ffffff26;font-size:14px;font-weight:600}.ann li:first-child{border-top:0}
/* other screens */
.coach{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.coach:first-of-type{border-top:0}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.pk .card{text-align:center;margin:0}.pk b{font-size:26px;display:block;margin:6px 0}
.slots{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:12px;text-align:center}.slots button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:8px 0;cursor:pointer}.slots button.on{background:var(--pink);font-weight:700}
.scores{display:flex;gap:6px;flex-wrap:wrap}.scores button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-weight:800}.scores button.on{background:var(--pink)}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:#fff;border-radius:22px;padding:18px;max-width:380px;margin:16px}
.modal.sheet{align-items:flex-end;margin:0}.modal.sheet>div{width:100%;max-width:440px;border-radius:26px 26px 0 0;margin:0;display:grid;gap:8px;padding-bottom:26px}.sheet .btn{display:flex;gap:10px;align-items:center;justify-content:flex-start}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:10;max-width:90vw;font-weight:600}
/* floating dock (phone) */
.dock{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:8;gap:10px;padding:10px 12px;background:#fffffff2;border:1.5px solid var(--ink);border-radius:999px;box-shadow:0 10px 30px #0003}
.dk{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0}.dk.on{background:var(--pink)}
@media (max-width:860px){.grid,.home2{grid-template-columns:1fr}nav{display:none}.dock{display:flex}main{padding-bottom:110px}.toast{bottom:92px}.btn,.btn.sm,.roles button,.chip-b{min-height:44px}.scores button{width:44px;height:44px}
.fgrid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:74%;overflow-x:auto;scroll-snap-type:x proximity}.fcard{scroll-snap-align:start}}
@media (max-width:520px){.logo small{display:none}header{padding:10px 14px}.roles{margin-left:0}.welcome{padding:18px}}
@media (prefers-reduced-motion:reduce){.vid{animation:none}.btn{transition:none}}

/* shared across all pages */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 420px at 95% 8%,#86a97b55,transparent 70%),radial-gradient(380px 380px at 0% 30%,#ffc83d55,transparent 70%),radial-gradient(460px 460px at 80% 95%,#d4cd8655,transparent 70%),radial-gradient(380px 380px at 20% 100%,#4f7a5855,transparent 70%)}
.phead{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin:4px 0 16px;background:#ffffff80}
.phead .blobs i{opacity:.55}.phead h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1}.phead p{margin:8px 0 0;max-width:52ch}
.card{background:#ffffffee;border-radius:26px;box-shadow:0 1px 0 #0e0e1010}
.card h3{font-size:19px}
.card:has(.bar){background:var(--ink);color:#fff}.card:has(.bar) .mut{color:#ffffffa8}.card:has(.bar) .item,.card:has(.bar) .li{border-color:#ffffff26}.card:has(.bar) .bar{background:#ffffff26}
.draft{background:var(--cheese);border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px}
.pk .card{background:var(--ink);color:#fff}.pk .card .mut{color:#ffffffa8}.pk .card .btn{background:var(--cheese);color:var(--ink);border-color:var(--cheese)}
.card:has(.bar) .msg{color:var(--ink)}

.logo .mark{width:30px;height:30px;border:2px solid #000;flex:none;background:conic-gradient(var(--sqD) 25%,var(--sqL) 0 50%,var(--sqD) 0 75%,var(--sqL) 0) 0 0/50% 50%}
.eyebrow,.phead .eyebrow{font-family:ui-monospace,Menlo,monospace}
.big,.clk,.pk b{font-family:ui-monospace,Menlo,monospace}
.blk .chip.ok{background:var(--sqL)}

/* handmade rating + board-style calendar */
.scores{align-items:center;gap:2px}.scores .heart{width:auto;height:auto;border:0;background:none;border-radius:0;font-size:30px;line-height:1;color:#0e0e1022;-webkit-text-stroke:1.4px #000;padding:2px 1px;transition:transform .1s}
.scores .heart:hover{transform:scale(1.18) rotate(-6deg)}.scores .heart.on{color:#e0584f}
.sc-n{margin-left:10px;font:700 13px ui-monospace,Menlo,monospace}
.slots{gap:0;grid-template-columns:54px repeat(7,1fr);background:#000;border:2px solid #000;padding:1px;gap:1px;border-radius:6px;overflow:hidden}
.slots>b,.slots>span{background:var(--bg);font:700 11px ui-monospace,Menlo,monospace;padding:7px 0;display:flex;align-items:center;justify-content:center}
.slots button{border:0;border-radius:0;padding:0;height:44px;font-size:28px;color:#fffbe6;-webkit-text-stroke:1.2px #000;background:var(--sqL)}
.slots button:nth-child(even){background:var(--sqD)}.slots button:hover{filter:brightness(1.08)}.slots button.on{background:var(--pink);font-weight:400}
.pick{font:600 13px ui-monospace,Menlo,monospace;margin:8px 0 0}
@media (max-width:860px){.scores .heart{font-size:26px;min-height:0;min-width:0;width:auto;height:auto}.scores .heart{padding:6px 0}}
.scores button.heart.on{background:none}.scores button.heart{background:none}

.prof-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:112px;height:112px;border:2px solid #000;object-fit:cover;flex:none;border-radius:6px}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-size:72px;color:#fffbe6;-webkit-text-stroke:1.6px #000;background:conic-gradient(var(--sqD) 25%,var(--sqL) 0 50%,var(--sqD) 0 75%,var(--sqL) 0) 0 0/50% 50%}
.plink{color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--sqD)}
.mono{font-family:ui-monospace,Menlo,monospace}
